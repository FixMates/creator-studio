name: Bubbli CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "feat/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify showcase image URLs
        run: node scripts/check-showcase-images.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Build Cloud Functions
        run: npm --prefix functions run build
