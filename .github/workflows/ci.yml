name: Bubbli CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "feat/**", "codex/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Install dependencies
        run: npm ci
      - name: Verify showcase image URLs
        run: node scripts/check-showcase-images.mjs
      - name: Lint application
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Lint Cloud Functions
        run: npm --prefix functions run lint
      - name: Build Cloud Functions
        run: npm --prefix functions run build
      - name: Validate Firestore rules in emulator
        run: npm run test:rules
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run creator and admin E2E flows
        run: npm run test:e2e
